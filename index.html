<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>MANJAM Archive</title>
<style>
  :root { --ink:#1a1a1a; --accent:#4A5D6B; --line:#e8e6e2; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:-apple-system,'Segoe UI',Roboto,Arial,sans-serif; color:var(--ink); background:#fbfaf8; }
  header { background:#fff; border-bottom:1px solid var(--line); padding:16px; position:sticky; top:0; z-index:6; }
  .brand { font-size:20px; letter-spacing:4px; font-weight:700; }
  .brand span { color:var(--accent); }
  .tagline { font-size:11px; color:#8a8a8a; letter-spacing:1px; margin-top:2px; }
  .meta { font-size:12px; color:var(--accent); margin-top:6px; }
  .groups { display:flex; gap:10px; padding:12px 16px 0; }
  .gtab { flex:1; border:1px solid var(--line); background:#fff; border-radius:10px; padding:12px 8px; font-size:15px; font-weight:700; cursor:pointer; color:#555; text-align:center; }
  .gtab small { display:block; font-weight:400; font-size:11px; color:#999; margin-top:2px; }
  .gtab.on { background:var(--ink); color:#fff; border-color:var(--ink); }
  .gtab.on small { color:#c9c9c9; }
  .tabs { display:flex; gap:8px; overflow-x:auto; padding:10px 16px; background:#fff; border-bottom:1px solid var(--line); -webkit-overflow-scrolling:touch; position:sticky; top:118px; z-index:5; }
  .tab { flex:0 0 auto; border:1px solid var(--line); background:#fff; border-radius:999px; padding:6px 14px; font-size:13px; cursor:pointer; color:#555; }
  .tab.on { background:var(--accent); color:#fff; border-color:var(--accent); }
  .grid { display:grid; grid-template-columns:repeat(2,1fr); gap:12px; padding:14px 16px 60px; }
  @media(min-width:700px){ .grid{grid-template-columns:repeat(4,1fr);} }
  .card { background:#fff; border:1px solid var(--line); border-radius:12px; overflow:hidden; }
  .ph { width:100%; aspect-ratio:1/1.08; object-fit:contain; background:#fff; display:block; }
  .noph { width:100%; aspect-ratio:1/1.08; display:flex; align-items:center; justify-content:center; background:linear-gradient(145deg,#f4f2ef,#e9e6e1); color:#9a958d; font-size:12px; letter-spacing:2px; text-align:center; }
  .info { padding:10px 12px 12px; }
  .nm { font-size:13px; font-weight:600; line-height:1.35; min-height:36px; }
  .sub { font-size:11px; color:#8a8a8a; margin-top:3px; }
  .row { display:flex; justify-content:space-between; align-items:center; margin-top:8px; }
  .pr { font-size:14px; font-weight:700; color:var(--accent); }
  .eur { font-size:10px; color:#b0aba4; font-weight:400; }
  .cond { font-size:10px; padding:2px 8px; border-radius:999px; border:1px solid var(--line); color:#777; }
  .cond.new { border-color:#bcd3c6; color:#2e6b4f; background:#f2f8f4; }
  .badge { display:inline-block; font-size:9px; letter-spacing:1px; color:#8a8a8a; border:1px solid var(--line); border-radius:4px; padding:1px 5px; margin-bottom:4px; }
  .count { text-align:center; font-size:12px; color:#999; padding:4px; }
  a.card, .card { cursor:pointer; }
  a.card { text-decoration:none; color:inherit; display:block; }
  /* popup chi tiet */
  .ov { position:fixed; inset:0; background:rgba(20,18,16,.72); z-index:20; display:none; overflow-y:auto; -webkit-overflow-scrolling:touch; }
  .ov.on { display:block; }
  .sheet { background:#fff; max-width:560px; margin:4vh auto 40px; border-radius:16px; overflow:hidden; position:relative; }
  .x { position:absolute; top:10px; right:10px; z-index:2; width:34px; height:34px; border-radius:50%; border:none; background:rgba(0,0,0,.45); color:#fff; font-size:18px; cursor:pointer; }
  .gal { background:#fff; }
  .gal .main { width:100%; aspect-ratio:1/1.05; object-fit:contain; display:block; background:#fff; }
  .thumbs { display:flex; gap:8px; padding:8px 12px; }
  .thumbs img { width:56px; height:56px; object-fit:contain; border:1px solid var(--line); border-radius:8px; cursor:pointer; background:#fff; }
  .thumbs img.on { border-color:var(--accent); border-width:2px; }
  .det { padding:6px 16px 18px; }
  .det .nm2 { font-size:17px; font-weight:700; line-height:1.35; }
  .det .sub2 { font-size:12px; color:#8a8a8a; margin-top:4px; }
  .det .pr2 { font-size:20px; font-weight:800; color:var(--accent); margin-top:10px; }
  .det .eur2 { font-size:12px; color:#b0aba4; font-weight:400; }
  .ff { display:inline-block; margin-top:14px; font-size:12px; color:#8a8a8a; border:1px solid var(--line); border-radius:999px; padding:6px 14px; text-decoration:none; }
  .ff:hover { color:var(--accent); border-color:var(--accent); }
</style>
</head>
<body>
<header>
  <div class="brand">MANJAM <span>ARCHIVE</span></div>
  <div class="tagline">Found Globally. Chosen Precisely.</div>
  <div class="meta" id="meta">Đang tải…</div>
  <div class="groups" id="groups"></div>
</header>
<div class="tabs" id="tabs"></div>
<div class="grid" id="grid"></div>
<div class="count" id="count"></div>
<div class="ov" id="ov" onclick="if(event.target===this)closeDet()"><div class="sheet"><button class="x" onclick="closeDet()">×</button><div id="sheetBody"></div></div></div>
<script>
let items = [], group = 'CH', cat = 'all';
const CH_CATS = ['Kính','Nhẫn','Dây chuyền','Vòng tay','Bông tai','Da','Quần áo','Linh tinh'];
const FR_CATS = ['Túi','Phụ kiện','Giày','Đồng hồ','Trang sức','Ví & Pochette','Khăn'];

async function boot(){
  items = await (await fetch('items.json')).json();
  const nch = items.filter(i=>i.src==='CHROMEHEARTS').length;
  const nfr = items.length - nch;
  document.getElementById('meta').textContent = items.length + ' món — giá USD' + (nfr? ' (Farfetch quy đổi 1€ = $1.16)':'');
  render();
}
function render(){
  const g = document.getElementById('groups');
  const nch = items.filter(i=>i.src==='CHROMEHEARTS').length;
  const nfr = items.length - nch;
  g.innerHTML =
    '<div class="gtab '+(group==='CH'?'on':'')+'" onclick="setGroup(\'CH\')">Chrome Hearts<small>'+nch+' món</small></div>' +
    (nfr? '<div class="gtab '+(group==='FR'?'on':'')+'" onclick="setGroup(\'FR\')">Hermès Farfetch Pháp<small>'+nfr+' món · đang bổ sung ảnh</small></div>':'');
  document.querySelectorAll('.gtab').forEach(t=>t.style.flex='1');
  const cats = (group==='CH'?CH_CATS:FR_CATS).filter(c=>items.some(i=>(group==='CH'?'CHROMEHEARTS':'FARFETCH')===i.src&&i.cat===c));
  const tb = document.getElementById('tabs');
  tb.innerHTML = '<div class="tab '+(cat==='all'?'on':'')+'" onclick="setCat(\'all\')">Tất cả</div>' +
    cats.map(c=>'<div class="tab '+(cat===c?'on':'')+'" onclick="setCat(\''+c+'\')">'+c+'</div>').join('');
  let list = items.filter(i=>(group==='CH'?'CHROMEHEARTS':'FARFETCH')===i.src && (cat==='all'||i.cat===cat));
  cur = list;
  document.getElementById('grid').innerHTML = list.map((x,k)=>card(x,k)).join('');
  document.getElementById('count').textContent = list.length + ' món';
}
let cur = [];
function card(i,k){
  const img = i.img ? '<img class="ph" loading="lazy" src="'+i.img+'" alt="">' : '<div class="noph">'+(i.brand||'')+'<br>chờ ảnh</div>';
  const sub = [i.size&&i.size!=='OS'?('Size '+i.size):'', i.lens||'', i.color||''].filter(Boolean).join(' · ');
  const inner = img + '<div class="info"><div class="badge">'+(i.src==='FARFETCH'?'FARFETCH FR · HERMÈS':'CHROME HEARTS')+'</div><div class="nm">'+esc(i.name)+'</div>'
    + (sub?'<div class="sub">'+esc(sub)+'</div>':'')
    + '<div class="row"><div class="pr">$'+Number(i.price).toLocaleString('en-US')+(i.eur?' <span class="eur">('+Number(i.eur).toLocaleString('fr-FR')+' €)</span>':'')+'</div><div class="cond '+(i.cond==='Mới'?'new':'')+'">'+(i.cond||'')+'</div></div></div>';
  return '<div class="card" onclick="openDet('+k+')">'+inner+'</div>';
}
function openDet(k){
  const i = cur[k]; if(!i) return;
  const imgs = (i.imgs && i.imgs.length ? i.imgs : (i.img?[i.img]:[]));
  const gal = imgs.length
    ? '<div class="gal"><img class="main" id="mImg" src="'+imgs[0]+'" alt=""><div class="thumbs">'+imgs.map((u,x)=>'<img class="'+(x?'':'on')+'" src="'+u+'" onclick="pickImg(this,\''+u+'\')">').join('')+'</div></div>'
    : '<div class="noph" style="aspect-ratio:1/1">'+(i.brand||'')+'<br>chờ ảnh tách nền</div>';
  const sub = [i.size&&i.size!=='OS'?('Size '+i.size):'', i.lens?('Kính '+i.lens):'', i.color||'', i.mat||''].filter(Boolean).join(' · ');
  document.getElementById('sheetBody').innerHTML = gal + '<div class="det"><div class="badge">'+(i.src==='FARFETCH'?'FARFETCH FR · HERMÈS':'CHROME HEARTS')+'</div>'
    + '<div class="nm2">'+esc(i.name)+'</div>' + (sub?'<div class="sub2">'+esc(sub)+'</div>':'')
    + '<div class="pr2">$'+Number(i.price).toLocaleString('en-US')+(i.eur?' <span class="eur2">('+Number(i.eur).toLocaleString('fr-FR')+' €)</span>':'')+'</div>'
    + '<div class="sub2" style="margin-top:6px">Tình trạng: '+esc(i.cond||'—')+' · '+esc(i.cat||'')+'</div>'
    + (i.url?'<a class="ff" href="'+i.url+'" target="_blank" rel="noopener">Xem nguồn gốc trên Farfetch ↗</a>':'')
    + '</div>';
  document.getElementById('ov').classList.add('on');
  document.body.style.overflow='hidden';
}
function pickImg(el,u){ document.getElementById('mImg').src=u; document.querySelectorAll('.thumbs img').forEach(t=>t.classList.remove('on')); el.classList.add('on'); }
function closeDet(){ document.getElementById('ov').classList.remove('on'); document.body.style.overflow=''; }
function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function setGroup(g){ group=g; cat='all'; render(); }
function setCat(c){ cat=c; render(); }
boot();
</script>
</body>
</html>
